# Standalone deployment of the Magileads MCP server (HTTP transport).
# Runs on its own — the AI agent (e.g. Hermes) connects to it by URL.
#
# On Dokploy: point a Compose service at this repo; Dokploy builds the Dockerfile,
# gives the service a domain, and terminates TLS at its reverse proxy.
#
# Set the required variables in a .env file next to this compose (see .env.example):
#   MCP_AUTH_TOKEN      (required)  — the bearer token agents must send
#   MAGILEADS_API_KEY   or  MAGILEADS_EMAIL + MAGILEADS_PASSWORD
services:
  magileads-mcp:
    build: .
    image: magileads-mcp:latest
    container_name: magileads-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_HTTP_PORT=8080
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
      # --- Magileads auth: keep ONE of the following ---
      - MAGILEADS_API_KEY=${MAGILEADS_API_KEY:-}
      # - MAGILEADS_EMAIL=${MAGILEADS_EMAIL:-}
      # - MAGILEADS_PASSWORD=${MAGILEADS_PASSWORD:-}
      # - MAGILEADS_API_BASE=${MAGILEADS_API_BASE:-}
