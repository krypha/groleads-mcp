# Standalone Magileads MCP server (HTTP, multi-tenant).
# MCP_HTTP_AUTH=oauth (default), api_key, or both. OAuth modes require all
# OAUTH_* values; api_key mode can leave them blank. API keys are per client.
#
# On Dokploy: point a Compose service at this repo; Dokploy builds the Dockerfile,
# gives the service a domain, and terminates TLS at its reverse proxy.
#
# Supply OAuth secrets from the deployment secret store when enabled.
services:
  magileads-mcp:
    build: .
    image: magileads-mcp:latest
    container_name: magileads-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_AUTH=${MCP_HTTP_AUTH:-oauth}
      - MCP_ALLOW_API_KEY_QUERY=${MCP_ALLOW_API_KEY_QUERY:-false}
      - MAGILEADS_API_BASE=${MAGILEADS_API_BASE:-https://app.api-magileads.net}
      - OAUTH_ISSUER=${OAUTH_ISSUER:-}
      - OAUTH_MCP_RESOURCE=${OAUTH_MCP_RESOURCE:-}
      - OAUTH_API_RESOURCE=${OAUTH_API_RESOURCE:-}
      - OAUTH_INTERNAL_CLIENT_ID=${OAUTH_INTERNAL_CLIENT_ID:-}
      - OAUTH_INTERNAL_CLIENT_SECRET=${OAUTH_INTERNAL_CLIENT_SECRET:-}
      # - MAGILEADS_API_URL=${MAGILEADS_API_URL}
