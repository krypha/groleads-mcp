# Standalone deployment of the Magileads MCP server (HTTP transport, multi-tenant).
# Runs on its own — each AI agent / client connects by URL and presents its OWN
# Magileads API key per request (X-Magileads-Api-Key header, Authorization: Bearer,
# or ?api_key=). There is no shared gate token to configure.
#
# On Dokploy: point a Compose service at this repo; Dokploy builds the Dockerfile,
# gives the service a domain, and terminates TLS at its reverse proxy.
#
# MAGILEADS_API_KEY below is OPTIONAL — set it only if you want a single default
# account for keyless requests. Leave it unset for a pure multi-tenant deployment
# (keyless requests are then rejected).
services:
  magileads-mcp:
    build: .
    image: magileads-mcp:latest
    container_name: magileads-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_HTTP_PORT=8080
      # --- Optional default account (keyless requests fall back to this) ---
      # - MAGILEADS_API_KEY=${MAGILEADS_API_KEY:-}
      # - MAGILEADS_EMAIL=${MAGILEADS_EMAIL:-}
      # - MAGILEADS_PASSWORD=${MAGILEADS_PASSWORD:-}
      # - MAGILEADS_API_BASE=${MAGILEADS_API_BASE:-}
